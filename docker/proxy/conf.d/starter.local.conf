# Edge routing for starter.local. This proxy terminates TLS and routes by host;
# it holds no knowledge of the app's document root or framework — the app
# container serves those from its own nginx (see docker/nginx/).

server {
    listen 80;
    server_name starter.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name starter.local;

    ssl_certificate     /etc/nginx/ssl/star.starter.local.crt;
    ssl_certificate_key /etc/nginx/ssl/star.starter.local.key;

    client_max_body_size 100m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        resolver 127.0.0.11 valid=30s;
        set $upstream_app app:80;
        proxy_pass http://$upstream_app;
        proxy_read_timeout 300;
    }
}
